<svg viewBox="0 0 900 340" width="900" height="340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="roseG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="340" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="900" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="25" cy="25" r="5" fill="#f43f5e" />
  <circle cx="42" cy="25" r="5" fill="#f59e0b" />
  <circle cx="59" cy="25" r="5" fill="#10b981" />
  
  <text x="85" y="30" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">SYE Division Architecture & On-Premise Multi-Cluster Topology</text>
  <text x="875" y="30" fill="#94a3b8" font-family="'Inter', monospace" font-size="11" font-weight="500" text-anchor="end">AEON SYE Technical Standard</text>

  <!-- Diagram Elements -->
  <g transform="translate(0, 50)">
    
            <rect x="30" y="30" width="160" height="85" rx="12" fill="url(#blueG)" filter="url(#boxShadow)"/>
            <text x="110" y="65" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">API &amp; Integration</text>
            <text x="110" y="85" fill="#dbeafe" font-family="sans-serif" font-size="10" text-anchor="middle">Gateway / Auth / Token</text>

            <rect x="230" y="30" width="160" height="85" rx="12" fill="url(#purpleG)" filter="url(#boxShadow)"/>
            <text x="310" y="65" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Customer Exp (CES)</text>
            <text x="310" y="85" fill="#ede9fe" font-family="sans-serif" font-size="10" text-anchor="middle">Mobile / Web / CDP</text>

            <rect x="430" y="30" width="160" height="85" rx="12" fill="url(#cyanG)" filter="url(#boxShadow)"/>
            <text x="510" y="65" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">User Apps (UAS)</text>
            <text x="510" y="85" fill="#cffafe" font-family="sans-serif" font-size="10" text-anchor="middle">Back-Office / ERP</text>

            <rect x="630" y="30" width="240" height="85" rx="12" fill="url(#emeraldG)" filter="url(#boxShadow)"/>
            <text x="750" y="65" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Standards &amp; Quality (TSQ)</text>
            <text x="750" y="85" fill="#d1fae5" font-family="sans-serif" font-size="10" text-anchor="middle">SRE / Tanzu K8s / QA Automation</text>

            <!-- Infrastructure Tier -->
            <rect x="30" y="150" width="840" height="120" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
            <text x="50" y="180" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold uppercase">On-Premise Infrastructure Landscape (Sermmit DC &amp; DR Site)</text>

            <rect x="50" y="200" width="230" height="50" rx="8" fill="#1e293b" stroke="#3b82f6"/>
            <text x="165" y="225" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">F5 BIG-IP Ingress :8080</text>
            <text x="165" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">WAF &amp; mTLS Termination</text>

            <rect x="310" y="200" width="260" height="50" rx="8" fill="#1e293b" stroke="#10b981"/>
            <text x="440" y="225" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">VMware Tanzu Grid (TKG)</text>
            <text x="440" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">Production Microservices Mesh</text>

            <rect x="600" y="200" width="250" height="50" rx="8" fill="#1e293b" stroke="#f59e0b"/>
            <text x="725" y="225" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">RHEL 9 PostgreSQL 16</text>
            <text x="725" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">Patroni HA DB Cluster</text>
        
  </g>
</svg>