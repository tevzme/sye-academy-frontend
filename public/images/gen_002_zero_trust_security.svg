<svg viewBox="0 0 900 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="roseG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="900" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="25" cy="25" r="5" fill="#f43f5e" />
  <circle cx="42" cy="25" r="5" fill="#f59e0b" />
  <circle cx="59" cy="25" r="5" fill="#10b981" />
  
  <text x="85" y="30" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">Zero Trust Architecture & ISO 27001 Security Perimeter</text>
  <text x="875" y="30" fill="#94a3b8" font-family="'Inter', monospace" font-size="11" font-weight="500" text-anchor="end">NIST SP 800-207 Standard</text>

  <!-- Diagram Elements -->
  <g transform="translate(0, 50)">
    
            <rect x="40" y="40" width="180" height="110" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
            <text x="130" y="75" fill="#f43f5e" font-size="13" font-weight="bold" text-anchor="middle">Untrusted Client Zone</text>
            <text x="130" y="100" fill="#fff" font-size="11" text-anchor="middle">Mobile / Web / Partner</text>
            <text x="130" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">MFA &amp; Device Posture</text>

            <path d="M220 95 L300 95" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4"/>

            <rect x="300" y="25" width="220" height="140" rx="14" fill="url(#roseG)" filter="url(#boxShadow)"/>
            <text x="410" y="65" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Policy Enforcement (PEP)</text>
            <text x="410" y="90" fill="#ffe4e6" font-size="11" text-anchor="middle">Active Directory RBAC</text>
            <text x="410" y="115" fill="#ffe4e6" font-size="11" text-anchor="middle">JWT RS256 Validation</text>
            <text x="410" y="140" fill="#ffe4e6" font-size="10" text-anchor="middle">Context-Aware Access</text>

            <path d="M520 95 L600 95" stroke="#10b981" stroke-width="2"/>
            <text x="560" y="85" fill="#10b981" font-size="10" font-family="monospace" text-anchor="middle">mTLS 1.3</text>

            <rect x="600" y="40" width="260" height="110" rx="12" fill="url(#emeraldG)" filter="url(#boxShadow)"/>
            <text x="730" y="75" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Secure Microservice Mesh</text>
            <text x="730" y="100" fill="#d1fae5" font-size="11" text-anchor="middle">Least Privilege Authorization</text>
            <text x="730" y="125" fill="#d1fae5" font-size="10" text-anchor="middle">AES-256 Encrypted Data at Rest</text>
        
  </g>
</svg>