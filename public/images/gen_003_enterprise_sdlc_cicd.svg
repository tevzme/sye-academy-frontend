<svg viewBox="0 0 900 200" width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="roseG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="200" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="900" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="25" cy="25" r="5" fill="#f43f5e" />
  <circle cx="42" cy="25" r="5" fill="#f59e0b" />
  <circle cx="59" cy="25" r="5" fill="#10b981" />
  
  <text x="85" y="30" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">AEON Enterprise SDLC & Automated GitOps CI/CD Quality Gates</text>
  <text x="875" y="30" fill="#94a3b8" font-family="'Inter', monospace" font-size="11" font-weight="500" text-anchor="end">ISO 9001 QMS Standard</text>

  <!-- Diagram Elements -->
  <g transform="translate(0, 50)">
    
            <rect x="30" y="40" width="130" height="90" rx="10" fill="url(#blueG)"/>
            <text x="95" y="75" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">1. Feature PR</text>
            <text x="95" y="100" fill="#dbeafe" font-size="10" text-anchor="middle">GitHub Trunk-Based</text>

            <path d="M160 85 L200 85" stroke="#60a5fa" stroke-width="2"/>

            <rect x="200" y="40" width="150" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <text x="275" y="70" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">2. Quality Gates</text>
            <text x="275" y="92" fill="#fff" font-size="10" text-anchor="middle">SonarQube &gt;= 80%</text>
            <text x="275" y="112" fill="#94a3b8" font-size="9" text-anchor="middle">0 Vulnerabilities</text>

            <path d="M350 85 L390 85" stroke="#60a5fa" stroke-width="2"/>

            <rect x="390" y="40" width="140" height="90" rx="10" fill="url(#purpleG)"/>
            <text x="460" y="75" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">3. Harbor Image</text>
            <text x="460" y="100" fill="#ede9fe" font-size="10" text-anchor="middle">Trivy Vulnerability Scan</text>

            <path d="M530 85 L570 85" stroke="#60a5fa" stroke-width="2"/>

            <rect x="570" y="40" width="140" height="90" rx="10" fill="url(#emeraldG)"/>
            <text x="640" y="75" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">4. ArgoCD Sync</text>
            <text x="640" y="100" fill="#d1fae5" font-size="10" text-anchor="middle">Declarative Manifest</text>

            <path d="M710 85 L745 85" stroke="#10b981" stroke-width="2"/>

            <rect x="745" y="40" width="125" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
            <text x="807" y="75" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle">5. Tanzu K8s</text>
            <text x="807" y="100" fill="#fff" font-size="10" text-anchor="middle">Zero-Downtime</text>
        
  </g>
</svg>