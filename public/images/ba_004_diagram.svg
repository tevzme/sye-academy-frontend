<svg viewBox="0 0 900 240" width="900" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="roseG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="900" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="25" cy="25" r="5" fill="#f43f5e" />
  <circle cx="42" cy="25" r="5" fill="#f59e0b" />
  <circle cx="59" cy="25" r="5" fill="#10b981" />
  
  <text x="85" y="30" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">BA-004: Data Flow Analysis</text>
  <text x="875" y="30" fill="#94a3b8" font-family="'Inter', monospace" font-size="11" font-weight="500" text-anchor="end">AEON SYE Technical Standard Blueprint</text>

  <!-- Diagram Elements -->
  <g transform="translate(0, 50)">
    
                <!-- Process Step 1 -->
                <rect x="40" y="40" width="170" height="110" rx="12" fill="url(#purpleG)" filter="url(#boxShadow)"/>
                <text x="125" y="75" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">1. Input &amp; Trigger</text>
                <text x="125" y="100" fill="#ffffff" font-size="10" text-anchor="middle">Requirement / Event Stream</text>
                <text x="125" y="125" fill="#e2e8f0" font-size="9" text-anchor="middle">ISO 9001 / ISO 27001 Gate</text>

                <!-- Arrow 1 -->
                <path d="M210 95 L260 95" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="4"/>

                <!-- Process Step 2 -->
                <rect x="260" y="25" width="220" height="140" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#boxShadow)"/>
                <text x="370" y="65" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">2. Core Processing Engine</text>
                <text x="370" y="90" fill="#fff" font-size="11" text-anchor="middle">Tanzu Microservices Mesh</text>
                <text x="370" y="115" fill="#94a3b8" font-size="10" text-anchor="middle">Idempotent Transaction Logic</text>
                <text x="370" y="140" fill="#10b981" font-size="9" font-family="monospace" text-anchor="middle">AES-256 / SHA-256 Vault</text>

                <!-- Arrow 2 -->
                <path d="M480 95 L530 95" stroke="#10b981" stroke-width="2.5"/>

                <!-- Process Step 3 -->
                <rect x="530" y="40" width="170" height="110" rx="12" fill="url(#emeraldG)" filter="url(#boxShadow)"/>
                <text x="615" y="75" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">3. Data Settlement</text>
                <text x="615" y="100" fill="#d1fae5" font-size="10" text-anchor="middle">PostgreSQL 16 HA Cluster</text>
                <text x="615" y="125" fill="#d1fae5" font-size="9" text-anchor="middle">Patroni Auto-Replication</text>

                <!-- Arrow 3 -->
                <path d="M700 95 L740 95" stroke="#10b981" stroke-width="2.5"/>

                <!-- Process Step 4 -->
                <rect x="740" y="40" width="120" height="110" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
                <text x="800" y="75" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle">4. Audit &amp; Log</text>
                <text x="800" y="100" fill="#fff" font-size="10" text-anchor="middle">OpenTelemetry</text>
                <text x="800" y="125" fill="#94a3b8" font-size="9" text-anchor="middle">Grafana SIEM</text>
                
  </g>
</svg>