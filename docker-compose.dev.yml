version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sye-academy-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://localhost:8080
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./public:/app/public
